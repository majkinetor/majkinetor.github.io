<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miodrag Milić</title>
<script src="theme.js"></script>
<style>
:root{ --bg:#fbfbfa; --ink:#15181c; --dim:#5f666e; --accent:#2f6fd6;
  --mono:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111417;--ink:#e8ebee;--dim:#98a1a9;--accent:#6ea8ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111417;--ink:#e8ebee;--dim:#98a1a9;--accent:#6ea8ff;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--mono)}
main{max-width:640px;margin:0 auto;padding:18vh 16px 40px}
h1{font-size:22px;margin:0}
p{color:var(--dim);margin:6px 0 28px}
nav{display:flex;flex-direction:column;gap:6px}
nav a{color:var(--accent);text-decoration:none} nav a:hover{text-decoration:underline}
nav span{color:var(--dim)}
</style>
</head>
<body>
<main>
  <h1>Miodrag Milić</h1>
  <p>Software architect · automation · open source</p>
  <nav>
    <a href="about/">~/about</a>
    <a href="projects/">~/projects</a>
    <a href="musicbrainz-userscripts">~/musicbrainz</a>
    <a href="https://github.com/majkinetor">github.com/majkinetor</a>
  </nav>
</main>
</body>
</html>
