<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home 03 · Numbers first</title>
<style>
:root{ --bg:#fbfbfa; --ink:#15181c; --dim:#5f666e; --faint:#a3aab1; --rule:#e3e5e8; --accent:#2f6fd6; --panel:#f1f2f4;
  --mono:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace; --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111417;--ink:#e8ebee;--dim:#98a1a9;--faint:#5c646b;--rule:#23292e;--accent:#6ea8ff;--panel:#191d21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111417;--ink:#e8ebee;--dim:#98a1a9;--faint:#5c646b;--rule:#23292e;--accent:#6ea8ff;--panel:#191d21;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--mono)}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mockbar{font:12px var(--mono);color:var(--faint);padding:10px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mockbar a{color:var(--faint)}

main{max-width:760px;margin:0 auto;padding:14vh 16px 60px}
h1{font-size:22px;margin:0} .tag{color:var(--dim);margin:6px 0 34px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:18px 0;margin-bottom:28px}
.nums b{display:block;font-size:clamp(30px,7vw,52px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.nums span{font-size:13px;color:var(--dim)}
nav{display:flex;flex-wrap:wrap;gap:6px 24px}
@media (max-width:420px){.nums{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="mockbar"><a href="index.html">← all layouts</a><span>03 · Numbers first</span><span><a href="02.html">prev</a> · <a href="04.html">next</a></span></div>
<main>
<h1>Miodrag Milić</h1><p class="tag">Software architect · automation · open source</p>
<div class="nums" id="nums"><div><b>26</b><span>years in production</span></div><div><b>42</b><span>projects</span></div><div><b>2M</b><span>citizens paid in hours (IDP)</span></div></div>
<nav><a href="https://milic.info/about/">~/about</a><a href="https://milic.info/projects/">~/projects</a><a href="https://milic.info/musicbrainz-userscripts">~/musicbrainz</a><a href="https://github.com/majkinetor">github</a></nav>
</main>
<script>
const num=(s,end)=>{if(!s)return null;const[y,m]=String(s).split('-').map(Number);return m?y+(m-1)/12+(end?1/12:0):y+(end?1:0)}
async function loadProjects(){const D=await (await fetch('projects.json')).json();const now=num(D.meta.asOf,true);
  D.projects.forEach(p=>{p._s=num(p.start);p._e=Math.min(p.end?num(p.end,true):now,now);p._on=!p.end});
  D.now=now;D.min=Math.floor(Math.min(...D.projects.map(p=>p._s)));return D}
const active=(D,t)=>D.projects.filter(p=>p._s<=t&&p._e>t).length

loadProjects().then(D=>{const n=document.querySelectorAll('#nums b');n[0].textContent=Math.floor(D.now-D.min);n[1].textContent=D.projects.length}).catch(()=>{})
</script>
</body>
</html>
