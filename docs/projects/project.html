<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project</title>
<script src="../theme.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column. Facts first, story second, related work last. */
:root{
  --bg:#fbfbfa; --ink:#14181c; --dim:#5d656d; --faint:#a3aab1; --rule:#e4e6e8; --accent:#2f6fd6;
  --sans:"Overpass",ui-sans-serif,system-ui,sans-serif; --mono:"Overpass Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111417;--ink:#e9ecef;--dim:#9aa3ab;--faint:#5c646b;--rule:#22282d;--accent:#6ea8ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111417;--ink:#e9ecef;--dim:#9aa3ab;--faint:#5c646b;--rule:#22282d;--accent:#6ea8ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans)}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px 80px}
a{color:var(--accent)}
nav{font:13px var(--mono);color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
nav a{color:var(--dim)}
h1{font:800 clamp(34px,6vw,52px)/1.05 var(--sans);letter-spacing:-.02em;margin:22px 0 4px}
.sub{font-size:19px;color:var(--dim);margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 22px;margin:26px 0;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.facts small{display:block;font:600 11px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.facts div{font-size:14.5px;min-width:0}
.span{margin:6px 0 26px}
.span svg{width:100%;height:46px;display:block}
.span .ax{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--faint)}
.metrics{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.metrics span{font:600 13px var(--mono);border:1px solid var(--rule);border-radius:6px;padding:4px 10px}
.body{max-width:65ch}
.body p{margin:0 0 14px}
.body ul{padding-left:20px}
h2{font:800 15px var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:34px 0 10px}
.rel{display:flex;flex-direction:column;gap:6px}
.rel a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;text-decoration:none;color:var(--ink);padding:4px 0;border-bottom:1px solid var(--rule)}
.rel a:hover b{color:var(--accent)}
.rel span{font:12px var(--mono);color:var(--dim);white-space:nowrap}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:40px;font-size:14px}
.err{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="err">Loading…</p></div>
<script src="pf.js"></script>
<script>
const {h, svg} = PF
const md = s => s.split(/\n\n+/).map(b => {
  const inl = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>')
  return /^- /.test(b) ? '<ul>' + b.split('\n').map(l => `<li>${inl(l.replace(/^- /,''))}</li>`).join('') + '</ul>' : `<p>${inl(b)}</p>` }).join('')
PF.load('projects.json').then(D => { render(D); addEventListener('hashchange', () => { render(D); scrollTo(0, 0) }) })
function render(D) {
  const id = location.hash.slice(1) || new URLSearchParams(location.search).get('id')
  const p = D.projects.find(x => x.id === id), app = document.getElementById('app')
  if (!p) { app.replaceChildren(h('p',{class:'err'}, `No project with id "${id}". `, h('a',{href:'./'}, 'Back to projects'))); return }
  document.title = `${p.title} · Projects`
  const chrono = [...D.projects].sort((a, b) => a._s - b._s), i = chrono.indexOf(p)
  const overlap = q => Math.max(0, Math.min(p._e, q._e) - Math.max(p._s, q._s))
  const related = D.projects.filter(q => q !== p && overlap(q) > .25).sort((a, b) => overlap(b) - overlap(a))
  // career strip: concurrency area with this project highlighted
  const W = 700, H = 46, x = t => (t - D.min) / (D.now - D.min) * W, ser = PF.series(D.projects, 1/4), max = Math.max(...ser.map(s => s.n))
  const strip = svg('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none','aria-label':'Project span within the whole career'})
  strip.append(svg('path',{d:`M0 ${H} ` + ser.map(s => `L${x(s.t)} ${H - 4 - s.n / max * (H - 12)}`).join(' ') + ` L${W} ${H} Z`,fill:'var(--rule)'}))
  strip.append(svg('rect',{x:x(p._s),y:0,width:Math.max(2, x(p._e) - x(p._s)),height:H,fill:PF.color(p),opacity:.22}))
  strip.append(svg('rect',{x:x(p._s),y:H - 4,width:Math.max(2, x(p._e) - x(p._s)),height:4,fill:PF.color(p)}))
  const fact = (k, v) => v ? h('div',{}, h('small',{},k), v) : ''
  const links = Object.entries(p.links || {})
  app.replaceChildren(
    h('nav',{}, h('a',{href:'../'}, 'milic.info'), '/', h('a',{href:'./'}, 'projects'), '/', p.id),
    h('h1',{}, p.title), h('p',{class:'sub'}, p.subtitle),
    h('div',{class:'facts'},
      fact('When', `${PF.range(p)} · ${PF.dur(p)}`), fact('For', p._clients.map(c => c.name).join(', ')),
      fact('Carried by', p._carrier.name + (p.partners ? ' with ' + p.partners.map(x => D.orgs[x]?.name || x).join(', ') : '')),
      fact('Role', (p.roles || []).join(', ')), fact('Stack', (p.tech || []).join(', ')),
      links.length ? fact('Links', h('span',{}, ...links.flatMap(([k, u], j) => [j ? ' · ' : '', h('a',{href:u}, k)]))) : ''),
    h('div',{class:'span'}, strip, h('div',{class:'ax'}, h('span',{}, D.min), h('span',{}, 'projects running at the same time'), h('span',{}, Math.floor(D.now)))),
    (p.metrics || []).length ? h('div',{class:'metrics'}, ...p.metrics.map(m => h('span',{}, m))) : '',
    h('div',{class:'body', html: md(p.summary + (p.body ? '\n\n' + p.body : ''))}),
    ...(related.length ? [h('h2',{}, `Running alongside (${related.length})`), h('div',{class:'rel'}, ...related.slice(0, 8).map(q => h('a',{href:`project.html#${q.id}`}, h('b',{}, q.title), h('span',{}, PF.range(q)))))] : []),
    h('div',{class:'pn'},
      i > 0 ? h('a',{href:`project.html#${chrono[i - 1].id}`}, '← ' + chrono[i - 1].title) : h('span'),
      i < chrono.length - 1 ? h('a',{href:`project.html#${chrono[i + 1].id}`}, chrono[i + 1].title + ' →') : h('span')))
}
</script>
</body>
</html>
